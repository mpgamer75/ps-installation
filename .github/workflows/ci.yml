name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = @(Invoke-ScriptAnalyzer -Path ./src -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          $issues += @(Invoke-ScriptAnalyzer -Path ./install.ps1 -Settings ./PSScriptAnalyzerSettings.psd1)
          $issues += @(Invoke-ScriptAnalyzer -Path ./uninstall.ps1 -Settings ./PSScriptAnalyzerSettings.psd1)
          $issues | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap
          if ($issues.Count -gt 0) { throw "$($issues.Count) probleme(s)" }
      - name: Traductions anglaises
        shell: pwsh
        run: ./build/Test-Translations.ps1 -Strict -Quiet

  test:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Windows PowerShell 5.1', os: windows-latest, shell: powershell }
          - { name: 'PowerShell 7 / Windows', os: windows-latest, shell: pwsh }
          - { name: 'PowerShell 7 / Linux', os: ubuntu-latest, shell: pwsh }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5

      - name: Pester
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -MinimumVersion 5.0.0
          $result = Invoke-Pester ./tests -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) test(s) en echec" }

      # Bout en bout sur une vraie machine Windows, sans élévation préalable :
      # installation utilisateur, PATH, lanceurs .cmd, outils réels, désinstallation.
      - name: Installation utilisateur et outils réels
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          ./install.ps1 -Scope CurrentUser -Yes
          $bin = Join-Path $env:LOCALAPPDATA 'ps-tools\bin'
          if (-not (Test-Path (Join-Path $bin 'monitor.cmd'))) { throw 'lanceur absent' }
          $userPath = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (@($userPath -split ';') -notcontains $bin) { throw "PATH utilisateur non mis à jour : $userPath" }
          $env:PATH = "$env:PATH;$bin"
          $env:NO_COLOR = '1'
          function Assert-Run {
            param([string]$Label, [scriptblock]$Block, [string]$Expect, [switch]$AnyExitCode)
            Write-Host "::group::$Label"
            $out = (& $Block 2>&1 | Out-String)
            Write-Host $out
            Write-Host '::endgroup::'
            if (-not $AnyExitCode -and $LASTEXITCODE -ne 0) { throw "$Label : code de sortie $LASTEXITCODE" }
            if ($Expect -and $out -notmatch $Expect) { throw "$Label : sortie inattendue (attendu : $Expect)" }
          }
          Assert-Run 'pst'            { cmd /c pst }                       'monitor'
          # doctor signale aussi les homonymes déjà présents sur la machine : on vérifie seulement qu'il s'exécute.
          Assert-Run 'pst doctor'     { cmd /c pst doctor }                'PowerShell' -AnyExitCode
          Assert-Run 'monitor -Once'  { cmd /c monitor -Once }             'Processeur'
          Assert-Run 'sysinfo'        { cmd /c sysinfo }                   'Windows'
          Assert-Run 'sysinfo -Json'  { cmd /c sysinfo -Json }             '"MemoryTotal"'
          Assert-Run 'ports'          { cmd /c ports }                     'TCP'
          Assert-Run 'netinfo'        { cmd /c netinfo -Offline }          'IPv4'
          Assert-Run 'dsize'          { cmd /c dsize . -Top 5 }            'Taille'
          Assert-Run 'clean -DryRun'  { cmd /c clean -DryRun }             'Espace'
          Assert-Run 'clean -List'    { cmd /c clean -List }               'temp'
          Assert-Run 'ping-mon'       { cmd /c ping-mon 127.0.0.1 -Count 2 } '127\.0\.0\.1'
          Assert-Run 'events'         { cmd /c events -Hours 48 }           'avertissement'
          Assert-Run 'gst'            { cmd /c gst }                        'Branche'
          Assert-Run 'loc'            { cmd /c loc }                        'lignes de code'
          Assert-Run 'dev uuid'       { cmd /c dev uuid }                   '^\s*[0-9a-f]{8}-'
          Assert-Run 'dev (pipeline)' { cmd /c "echo abc| dev b64" }        'YWJj'
          Assert-Run 'watch'          { cmd /c watch -Count 1 "Get-Date" }  'watch'
          Set-Content -Path "$env:TEMP\pst-ci.log" -Value 'INFO ok', 'ERROR boum'
          Assert-Run 'logtail'        { cmd /c logtail "$env:TEMP\pst-ci.log" -NoFollow } 'ERROR boum'
          Assert-Run 'ask (sans clef)' { cmd /c ask bonjour }               'ask -Setup' -AnyExitCode
          Assert-Run 'pst keys'       { cmd /c pst keys }                   'Alt\+A'
          $env:PSTOOLS_LANG = 'en'
          Assert-Run 'pst (anglais)'  { cmd /c pst }                        'EVERYDAY'
          Assert-Run 'calc (anglais)' { cmd /c calc "2 * (3 + 4)" }         '14'
          Assert-Run 'todo (anglais)' { cmd /c todo add "Buy bread" -Due tomorrow } 'Buy bread'
          $env:PSTOOLS_LANG = 'fr'
          Assert-Run 'tidy (simulation)' { cmd /c tidy $env:TEMP -DryRun }  '.'
          Assert-Run 'dupes'          { cmd /c dupes . -Min 1KB }           '.'
          Assert-Run 'paths'          { cmd /c paths }                      'PATH'
          Assert-Run 'gitignore'      { cmd /c gitignore -Help }            'gitignore'
          Assert-Run 'cheat'          { cmd /c cheat -Help }                'cheat'
          Assert-Run 'timer'          { cmd /c timer 2s }                   '.'
          Assert-Run 'pst usage'      { cmd /c pst usage }                  'consommation'
          Assert-Run 'ask -Status'    { cmd /c ask -Status }                'Fournisseur'
          # Integration au shell : le profil modifie doit se charger dans un shell neuf.
          Assert-Run 'pst shell on'   { cmd /c pst shell on -Yes }          'Profil'
          $exe = (Get-Process -Id $PID).Path
          $count = (& $exe -NoLogo -Command "(Get-Command mkcd, mark, jump -ErrorAction SilentlyContinue).Count" | Out-String).Trim()
          if ($count -ne '3') { throw "integration au shell non chargee par le profil : '$count'" }
          Assert-Run 'pst shell off'  { cmd /c pst shell off }              'retir'
          Assert-Run 'remind add'     { cmd /c remind add "Test CI" -In 2h } 'enregistr'
          if (-not (Get-ScheduledTask -TaskName 'PsTools_Reminder_*' -ErrorAction SilentlyContinue)) { throw 'tâche planifiée non créée' }
          Assert-Run 'remind list'    { cmd /c remind list }               'Test CI'
          Assert-Run 'remind rm'      { cmd /c remind rm 1 }               'supprim'
          if (Get-ScheduledTask -TaskName 'PsTools_Reminder_*' -ErrorAction SilentlyContinue) { throw 'tâche planifiée non supprimée' }

      # Scénario réel d'entreprise : profil PowerShell sur un partage réseau, stratégie RemoteSigned.
      # Le partage administratif \\127.0.0.1\C$ est vu comme « distant » par Windows.
      - name: Profil sur un partage réseau
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          try { Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force } catch { Write-Host $_ }
          $dir = Join-Path $env:TEMP 'pst-unc'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $unc = '\\127.0.0.1\' + ($dir -replace '^([A-Za-z]):', '$1$')
          if (-not (Test-Path $unc)) { Write-Host '::warning::partage administratif indisponible, test ignore'; exit 0 }
          $env:PSTOOLS_PROFILE = Join-Path $unc 'profile.ps1'
          $env:PSTOOLS_DATA = Join-Path $env:TEMP 'pst-unc-data'
          . ./src/lib/PsTools.ps1; . ./src/lib/PsTools.AI.ps1; . ./src/lib/PsTools.Wizard.ps1
          $app = (Resolve-Path ./src).Path
          if (Test-PstProfileLoadable $env:PSTOOLS_PROFILE) { Write-Host '::warning::le partage n est pas traite comme distant sur ce runner, test ignore'; exit 0 }
          # 1. Profil bloqué : rien n'est écrit (donc aucune erreur au démarrage du terminal).
          $r = Enable-PstShell -AppRoot $app
          if ($r.Blocked.Count -ne 1 -or (Test-Path $env:PSTOOLS_PROFILE)) { throw 'un profil bloque a ete modifie' }
          # 2. Solution « partage de confiance » (zone Intranet).
          Grant-PstShareTrust '127.0.0.1'
          $trusted = Test-PstProfileLoadable $env:PSTOOLS_PROFILE
          Revoke-PstShareTrust '127.0.0.1'
          if ($trusted) { Write-Host 'zone Intranet : OK' } else { Write-Host '::warning::la zone Intranet par adresse IP est sans effet sur ce runner' }
          # 3. Solution « Bypass pour l'utilisateur » : doit rendre le profil chargeable.
          Set-PstUserPolicy 'Bypass'
          if (-not (Test-PstProfileLoadable $env:PSTOOLS_PROFILE)) { throw 'Bypass sans effet' }
          $r = Enable-PstShell -AppRoot $app
          if ($r.Written.Count -ne 1) { throw 'profil non ecrit apres correctif' }
          Remove-Item Env:PSExecutionPolicyPreference -ErrorAction SilentlyContinue
          $exe = (Get-Process -Id $PID).Path
          $loaded = (& $exe -NoLogo -NoProfile -Command ". '$env:PSTOOLS_PROFILE'; [bool](Get-Command jump -ErrorAction SilentlyContinue)" 2>&1 | Out-String)
          Write-Host $loaded
          if ($loaded -notmatch 'True') { throw 'le profil reseau ne charge pas l integration' }
          $null = Disable-PstShell
          Set-PstUserPolicy 'RemoteSigned'

      - name: Désinstallation
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          # Commande dediee, lancee comme le ferait l'utilisateur ; la suppression des fichiers est differee.
          $env:PATH = "$env:PATH;$(Join-Path $env:LOCALAPPDATA 'ps-tools\bin')"
          cmd /c pst-uninstall -Yes -Purge
          if ($LASTEXITCODE -ne 0) { throw "pst-uninstall : code de sortie $LASTEXITCODE" }
          $root = Join-Path $env:LOCALAPPDATA 'ps-tools'
          for ($i = 0; $i -lt 40 -and (Test-Path $root); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $root) { throw "dossier encore present : $(Get-ChildItem $root -Recurse -Name | Out-String)" }
          # L'amorce web doit ensuite constater qu'il ne reste rien.
          ./uninstall.ps1 -Yes -PurgeData
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'ps-tools\bin')) { throw 'dossier bin encore présent' }
          $userPath = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if ($userPath -match 'ps-tools') { throw "PATH non nettoyé : $userPath" }
